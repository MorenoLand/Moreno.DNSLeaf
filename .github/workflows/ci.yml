name: Manual checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -mod=vendor ./...
      - run: go test -race -mod=vendor ./...
      - run: go vet -mod=vendor ./...
      - run: go test -mod=mod ./...
      - run: go mod verify
      - run: git diff --check
